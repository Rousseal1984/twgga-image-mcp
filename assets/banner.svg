    右下角落在 (168,180)。原图是黑徽章白字；这里整体取白，衬线 T 用底色
    镂空出来，明暗关系与原图一致。切角方块与 T 的轮廓一点没动，没有外框。
  -->
  <g transform="translate(48 60) scale(0.5) translate(-136.001 -136.001)">
