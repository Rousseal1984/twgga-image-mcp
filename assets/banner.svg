<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="TWGGA IMAGE — GPT Image 2 MCP server">
  <!--
    黑底白 logo。fork 原设计的深蓝底、青色和「带引脚芯片」外框已整组移除，
    这里不再有任何把标识框住的容器。
  -->
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
