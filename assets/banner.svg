      <path d="M130.603,187.418L183.49,134.531L370.6,134.531L370.6,322.371L318.443,374.528L130.603,374.528L130.603,187.418Z" fill="#ffffff"/>
      <path d="M254.47,178.599C252.581,178.577 248.55,178.6 240.34,178.868C224.568,179.382 214.379,202.111 212.789,208.929L204.095,209.023L205.904,165.378L285.771,165.378L285.771,290.384C286.083,293.538 288.546,300.952 304.249,304.626L304.249,312.697L235.992,312.697L235.992,304.626C251.694,300.952 254.157,293.538 254.47,290.384L254.47,178.599Z" fill="#000000"/>
      <path d="M309.609,165.378L341.143,165.378L343.724,209.023L334.985,209.023L309.609,165.378Z" fill="#000000"/>
